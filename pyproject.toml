[build-system]
requires = ["setuptools>=84.1.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "The model proposes. The harness decides."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
    "langgraph>=1.0,<2",
    "fastapi>=0.135,<1",
    "uvicorn>=0.38,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "pip-audit>=2.9,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"
agent-harness-server = "agent_harness.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_harness.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]
